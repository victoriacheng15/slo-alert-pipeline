name: Continuous Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-container:
    name: Build & Publish Multi-Arch Mock App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/mock-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Multi-Arch Container
        uses: docker/build-push-action@v7
        with:
          context: workloads/mock-app
          file: workloads/mock-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  package-artifacts:
    name: Package Release Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Bundle Kubernetes Manifests & Dashboards
        run: |
          mkdir -p release
          tar -czvf release/slo-alert-pipeline-manifests.tar.gz manifests/ dashboards/

      - name: Upload Manifest Bundle
        uses: actions/upload-artifact@v7
        with:
          name: slo-alert-pipeline-manifests
          path: release/slo-alert-pipeline-manifests.tar.gz
          retention-days: 30
