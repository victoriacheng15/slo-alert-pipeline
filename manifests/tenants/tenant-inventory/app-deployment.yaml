apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: tenant-inventory
  labels:
    app: inventory-service
    service: inventory
    tenant: tenant-inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        service: inventory
        tenant: tenant-inventory
    spec:
      containers:
        - name: mock-app
          image: localhost/mock-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "inventory"
            - name: TENANT_NAME
              value: "tenant-inventory"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: tenant-inventory
  labels:
    app: inventory-service
    service: inventory
    tenant: tenant-inventory
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: inventory-service
