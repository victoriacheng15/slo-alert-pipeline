# Baseline configuration for kube-prometheus-stack on lightweight / local clusters (k3s)

# Disable control-plane scrapers not exposed as standalone scrapable targets in k3s
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

# Node and cluster state observability
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# Prometheus configuration
prometheus:
  prometheusSpec:
    scrapeInterval: 10s
    evaluationInterval: 10s
    retention: 2d
    # Enable discovery of Custom Resources across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 1024Mi
        cpu: 1000m

# Alertmanager configuration
alertmanager:
  alertmanagerSpec:
    # Discover tenant-level AlertmanagerConfig resources across all namespaces
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m

# Grafana configuration
grafana:
  enabled: true
  adminPassword: "admin"
  defaultDashboardsEnabled: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
      cpu: 500m
